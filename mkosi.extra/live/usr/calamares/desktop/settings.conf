---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/calamares/modules, /usr/share/calamares/modules  ]

instances:
- id: uki
  module: shellprocess
  config: shellprocess@uki.conf

sequence:
  # WARNING: You must also change the icon assocation in calamares-sidebar.qml!
  - show:
    - welcome
    - partition

  - exec:
    - partition
    - mount
    - subvol
    - machineid
    - displaymanager
    - hwclock
    - shellprocess@uki
    - umount

  - show:
    - finished

branding: kde-linux
prompt-install: false
disable-cancel-during-exec: true
