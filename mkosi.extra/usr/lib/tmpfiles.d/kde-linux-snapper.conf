# Snapper reads the list of active configs from the sysconfig file and fails
# outright if it is missing, so make sure there is one. It only ever reaches an
# installed system through the factory, which means systems updated from an
# image without snapper never see it. Snapper fills in SNAPPER_CONFIGS itself.

# The path is baked in at build time as CONF_DIR. Our buildstream one points at /etc/sysconfig,
# matching btrfsmaintenance, while the Arch package uses /etc/conf.d, so that one
# is a symlink for as long as we are on Arch to not break configs when moving to buildstream.
d /etc/sysconfig 0755 root root -
f /etc/sysconfig/snapper 0644 root root - SNAPPER_CONFIGS=""
d /etc/conf.d 0755 root root -
L /etc/conf.d/snapper - - - - /etc/sysconfig/snapper


# Directories required by snapper for the per-user home configs.
d /etc/snapper/configs 0755 root root -
