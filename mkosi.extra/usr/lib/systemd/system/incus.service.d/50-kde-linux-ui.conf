# The packaged incus.service points INCUS_UI at /usr/share/incus-ui, which does
# not exist and cannot be created on our read-only /usr. Point it at a writable
# location instead, so users can install a web UI of their choice by copying
# its files into /var/lib/incus/ui and restarting incus.service.
#
# The directory is deliberately not created for them: incus only serves the UI
# when the directory exists, and an empty one would serve an empty page.
[Service]
Environment=INCUS_UI=/var/lib/incus/ui
