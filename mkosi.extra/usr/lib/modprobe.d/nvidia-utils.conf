# nvidia-utils installs this config to prevent nouveau from loading when nvidia is installed.
# That may make sense with packages, but with an image we need to stay flexible.
# Override this file so the kernel/systemd can pick a suitable module at their own discretion.
# Should this prove unreliable, we'll need to build an initrd-level service or a systemd generator to conditionally load nvidia/nouveau as necessary.
