# The tools are provided by the CI image, nothing is downloaded at runtime.
exclude: go\.sum$|^mkosi\.extra/usr/(lib/iw-set-regdomain|share/fontconfig/conf\.default/56-kde-linux-noto\.conf)$

repos:
  - repo: local
    hooks:
      - id: check-toml
        name: check toml
        entry: check-toml
        language: system
        types: [toml]

      - id: check-merge-conflict
        name: check for merge conflicts
        entry: check-merge-conflict
        args: [--assume-in-merge]
        language: system
        types: [text]

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        args: [--severity=style, "--exclude=SC1091,SC1111,SC2129"]
        language: system
        types: [shell]
        exclude_types: [zsh]
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        args: ["--extend-ignore=BLE001,EXE001,I001"]
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: codespell
        name: codespell
        entry: codespell
        args: ["--ignore-words-list=overlayed,unparseable"]
        language: system
        types: [text]
        exclude: ^po/|\.(desktop|metainfo\.xml)$
